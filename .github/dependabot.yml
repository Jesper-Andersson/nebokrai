# Weekly update pull requests for npm packages and for the actions CI uses.
#
# cooldown: a release must be a week old before it is proposed. A hijacked
# package is usually found and removed within days, so this keeps the freshest
# (and riskiest) releases out. Security updates are not delayed by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # One pull request for the routine minor and patch updates
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
