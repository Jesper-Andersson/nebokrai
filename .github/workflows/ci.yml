name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request stops the run before it. On main every run
# finishes, because it may be deploying: they queue instead.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a tag: a tag can be moved to other
      # code, a commit cannot. Dependabot keeps the pins and the version
      # comments up to date (.github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the token in .git/config for later steps to read
          persist-credentials: false
          # The secret scan below reads every commit, not only the newest
          fetch-depth: 0

      # A key or token committed by mistake stays in the history for good, so
      # the whole history is scanned on every run. The download is checked
      # against the release's published SHA-256 before it runs. Dependabot
      # does not see this pin: raise the version and the checksum together.
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Every installed package must carry a valid signature from the npm
      # registry: catches a tampered or substituted download.
      - name: Package signatures
        run: npm audit signatures

      - name: Type check
        run: npm run check

      # nebokrai.db and vesum.db are not in the repository, so the tests that
      # compare the TypeScript search with the Python reference are skipped
      # here. Run `npm test` locally with both databases to check those.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Python syntax
        run: python3 -m py_compile data/*.py

  # Every merge into main goes live: once the checks above pass, the site is
  # built again and published to nebokrai.app. Merging a pull request is the
  # go-ahead for this step; nothing else here changes the Cloudflare account.
  # Dictionary rebuilds (new D1 databases, --remote imports) stay by hand: see
  # "Publishing to D1" in data/README.md.
  #
  # Needs two secrets on the GitHub environment "production":
  # CLOUDFLARE_API_TOKEN (the "Edit Cloudflare Workers" template, this
  # account only) and CLOUDFLARE_ACCOUNT_ID. The site's own secrets (sign-in,
  # Turnstile, report email) stay in Cloudflare and are kept by a deploy.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nebokrai.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs queue on main, so one for an older commit can come after a newer
      # one has gone out. Only the newest commit on main is deployed.
      - name: Still the newest commit on main
        id: newest
        env:
          REPO: ${{ github.repository }}
        run: |
          tip=$(git ls-remote "https://github.com/$REPO.git" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then echo "go=true" >> "$GITHUB_OUTPUT"
          else echo "main has moved on to $tip: leaving the deploy to its run"; fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.newest.outputs.go
        with:
          node-version: 22
          cache: npm

      - if: steps.newest.outputs.go
        run: npm ci

      # static/words.json is made from nebokrai.db, which CI does not have. No
      # page loads it yet (client-suggest.ts is not used by one), so the build
      # goes out without it, as the live site already is.
      - name: Build
        if: steps.newest.outputs.go
        run: npm run build

      - name: Deploy
        if: steps.newest.outputs.go
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx wrangler deploy --message "main ${GITHUB_SHA::7}"

      # The home page and a word page must answer once the new version is out.
      # If not, `npx wrangler rollback` puts the previous version back.
      - name: Live site answers
        if: steps.newest.outputs.go
        run: |
          for path in / /word/voda; do
            for try in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://nebokrai.app$path")
              [ "$code" = 200 ] && break
              sleep 10
            done
            echo "$path: $code"
            [ "$code" = 200 ] || exit 1
          done
