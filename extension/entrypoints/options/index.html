<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<meta name="manifest.open_in_tab" content="true" />
		<title>Nebokrai</title>
		<style>
			/* The site's colours (src/app.css there), light and its warm dark, by the device's setting */
			:root {
				--bg: #f7f6f2;
				--surface: #ffffff;
				--surface-2: #f0eee7;
				--raised: #ffffff;
				--border: #e3e0d6;
				--border-strong: #cdc9bc;
				--ink: #16181d;
				--ink-2: #3c4049;
				--muted: #646a76;
				--accent: #1f5fbf;
				--accent-ink: #ffffff;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #131211;
					--surface: #1b1a18;
					--surface-2: #252320;
					--raised: #35332e;
					--border: #302e2a;
					--border-strong: #48453f;
					--ink: #f0ede7;
					--ink-2: #d4d0c8;
					--muted: #a39f96;
					--accent: #8db4f0;
					--accent-ink: #131211;
				}
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--ink);
				font: 15px/1.5 system-ui, sans-serif;
			}
		</style>
	</head>
	<body>
		<div id="app"></div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
