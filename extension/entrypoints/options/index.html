<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="color-scheme" content="light dark" />
		<meta name="manifest.open_in_tab" content="false" />
		<title>Nebokrai</title>
		<style>
			body {
				margin: 0;
				padding: 16px;
				font: 14px/1.45 system-ui, sans-serif;
			}
			label {
				display: block;
				margin-bottom: 14px;
			}
			select {
				margin-left: 8px;
				font: inherit;
			}
			p {
				max-width: 34em;
				margin: 18px 0 0;
			}
			input {
				margin: 0 8px 0 0;
			}
		</style>
	</head>
	<body>
		<label><span data-text="hoverKey"></span><select id="hoverKey"></select></label>
		<label><input type="checkbox" id="doubleClick" /><span data-text="doubleClick"></span></label>
		<label><span data-text="theme"></span><select id="theme"></select></label>
		<label><span data-text="font"></span><select id="font"></select></label>
		<label><span data-text="size"></span><select id="size"></select></label>
		<p><span data-text="sent"></span> <a id="privacy" target="_blank" rel="noopener"></a></p>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
