<!doctype html>
<html lang="%app.lang%" %app.theme% %app.bg%>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<!-- Phone browsers colour their own bars to match the header (--bg in
		     app.css). They follow the system's theme, not the one chosen in the
		     settings menu, which the browser cannot know before the page runs. -->
		<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)" />
		<!-- Lets a browser search the dictionary from its address bar (static/opensearch.xml) -->
		<link rel="search" type="application/opensearchdescription+xml" title="Nebokrai" href="/opensearch.xml" />
		<!-- What a phone needs to offer "Install app": the name, the icons and
		     how the installed app opens. With src/service-worker/. -->
		<link rel="manifest" href="/manifest.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
